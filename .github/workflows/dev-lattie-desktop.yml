name: Build Lattie Desktop Dev Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Base version (e.g. 1.0.0) — actual build version will be {version}-dev.{sha}
        required: true
        type: string
      ref:
        description: Branch or tag to checkout from first-quarter
        required: false
        default: develop
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.20.0'
  PNPM_STORE_PATH: ~/.pnpm-store
  APP_DIR: apps/lattie-desktop

jobs:
  # ============================================
  # Meta: 计算 dev 版本号和 tag
  # ============================================
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      semver: ${{ steps.meta.outputs.semver }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Checkout to get SHA
        uses: actions/checkout@v4
        with:
          repository: feiandxs/first-quarter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Compute dev version and tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="${{ inputs.version }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          SEMVER="${BASE_VERSION}-dev.${SHORT_SHA}"
          TAG_NAME="lattie-desktop/dev-v${BASE_VERSION}-${SHORT_SHA}"
          REF="${{ inputs.ref }}"

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

          echo "Version: ${SEMVER}"
          echo "Tag: ${TAG_NAME}"
          echo "Ref: ${REF}"

  # ============================================
  # macOS Universal Dev Build (arm64 + x64)
  # ============================================
  macos-universal:
    needs: meta
    runs-on: macos-latest
    env:
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
      OVERRIDE_VERSION: ${{ needs.meta.outputs.semver }}
      REF: ${{ needs.meta.outputs.ref }}
      CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.CSC_LINK_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: feiandxs/first-quarter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ env.REF }}

      - name: Configure code signing keychain
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/lattie-developer-id.p12"
          KEYCHAIN_NAME="lattie-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          echo "${CSC_LINK_BASE64}" | base64 --decode > "${CERT_PATH}"
          security delete-keychain "${KEYCHAIN_NAME}" 2>/dev/null || true
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security set-keychain-settings "${KEYCHAIN_NAME}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_NAME}" -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productsign
          existing_keychains=$(security list-keychains -d user | sed 's/\"//g')
          security list-keychains -d user -s "${KEYCHAIN_NAME}" ${existing_keychains}
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          echo "KEYCHAIN_NAME=${KEYCHAIN_NAME}" >> "${GITHUB_ENV}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust toolchain (universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Override version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs'), path = require('path')
          const appDir = process.env.APP_DIR, version = process.env.OVERRIDE_VERSION
          if (!appDir || !version) process.exit(1)
          const pkgPath = path.join(process.cwd(), appDir, 'package.json')
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          pkg.version = version
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')
          const confPath = path.join(process.cwd(), appDir, 'src-tauri', 'tauri.conf.json')
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'))
          conf.version = version
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n')
          const cargoPath = path.join(process.cwd(), appDir, 'src-tauri', 'Cargo.toml')
          const cargo = fs.readFileSync(cargoPath, 'utf8')
          fs.writeFileSync(cargoPath, cargo.replace(/^version = ".*"$/m, `version = "${version}"`))
          NODE

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --config.store-dir=${{ env.PNPM_STORE_PATH }}

      - name: Build Tauri (macOS Universal)
        shell: bash
        run: |
          pnpm --filter lattie-desktop tauri build \
            --target universal-apple-darwin \
            --bundles app,dmg \
            --ci

      - name: Validate notarization
        shell: bash
        run: |
          BUNDLE_DIR="${APP_DIR}/src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP_PATH=$(find "$BUNDLE_DIR" -maxdepth 1 -type d -name '*.app' -print -quit || true)
          [ -z "$APP_PATH" ] && { echo "::error::No .app found" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec -vv "$APP_PATH"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          BUNDLE_DIR="${APP_DIR}/src-tauri/target/universal-apple-darwin/release/bundle"
          find "$BUNDLE_DIR/macos" "$BUNDLE_DIR/dmg" -maxdepth 1 -type f \( \
            -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
          \) -exec cp {} release/ \; 2>/dev/null || true
          ls -la release

      - name: Upload macOS universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: release

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_NAME:-}" ]; then
            security delete-keychain "${KEYCHAIN_NAME}" || true
          fi

  # ============================================
  # Windows x64 Dev Build
  # ============================================
  windows-x64:
    needs: meta
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
      OVERRIDE_VERSION: ${{ needs.meta.outputs.semver }}
      REF: ${{ needs.meta.outputs.ref }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: feiandxs/first-quarter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ env.REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure pnpm for shorter paths
        shell: bash
        run: pnpm config set virtual-store-dir-max-length 70

      - name: Override version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs'), path = require('path')
          const appDir = process.env.APP_DIR, version = process.env.OVERRIDE_VERSION
          if (!appDir || !version) process.exit(1)
          const pkgPath = path.join(process.cwd(), appDir, 'package.json')
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          pkg.version = version
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')
          const confPath = path.join(process.cwd(), appDir, 'src-tauri', 'tauri.conf.json')
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'))
          conf.version = version
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n')
          const cargoPath = path.join(process.cwd(), appDir, 'src-tauri', 'Cargo.toml')
          const cargo = fs.readFileSync(cargoPath, 'utf8')
          fs.writeFileSync(cargoPath, cargo.replace(/^version = ".*"$/m, `version = "${version}"`))
          NODE

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (Windows x64)
        shell: bash
        run: |
          # dev 版本含 pre-release 标识符，MSI 格式要求纯数字版本，只打 NSIS
          pnpm --filter lattie-desktop tauri build \
            --bundles nsis \
            --ci

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          NSIS_DIR="${APP_DIR}/src-tauri/target/release/bundle/nsis"
          [ -d "$NSIS_DIR" ] && find "$NSIS_DIR" -maxdepth 1 -type f \( \
            -name '*.exe' -o -name '*.nsis.zip' -o -name '*.sig' \
          \) -exec cp {} release/ \;
          find release -maxdepth 1 -type f | while read -r f; do
            new="${f// /.}"; [ "$new" != "$f" ] && mv "$f" "$new"
          done
          ls -la release

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release

  # ============================================
  # Linux x64 Dev Build
  # ============================================
  linux-x64:
    needs: meta
    runs-on: ubuntu-22.04
    env:
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
      OVERRIDE_VERSION: ${{ needs.meta.outputs.semver }}
      REF: ${{ needs.meta.outputs.ref }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: feiandxs/first-quarter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ env.REF }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Override version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs'), path = require('path')
          const appDir = process.env.APP_DIR, version = process.env.OVERRIDE_VERSION
          if (!appDir || !version) process.exit(1)
          const pkgPath = path.join(process.cwd(), appDir, 'package.json')
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          pkg.version = version
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')
          const confPath = path.join(process.cwd(), appDir, 'src-tauri', 'tauri.conf.json')
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'))
          conf.version = version
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n')
          const cargoPath = path.join(process.cwd(), appDir, 'src-tauri', 'Cargo.toml')
          const cargo = fs.readFileSync(cargoPath, 'utf8')
          fs.writeFileSync(cargoPath, cargo.replace(/^version = ".*"$/m, `version = "${version}"`))
          NODE

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --config.store-dir=${{ env.PNPM_STORE_PATH }}

      - name: Build Tauri (Linux x64)
        shell: bash
        run: |
          pnpm --filter lattie-desktop tauri build \
            --bundles appimage,deb \
            --ci

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          BUNDLE_DIR="${APP_DIR}/src-tauri/target/release/bundle"
          find "$BUNDLE_DIR/appimage" "$BUNDLE_DIR/deb" -maxdepth 1 -type f \( \
            -name '*.AppImage' -o -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' \
            -o -name '*.deb' \
          \) -exec cp {} release/ \; 2>/dev/null || true
          ls -la release

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release

  # ============================================
  # Create Pre-release（不上传 latest.json）
  # ============================================
  create-release:
    needs:
      - meta
      - macos-universal
      - windows-x64
      - linux-x64
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
      OVERRIDE_VERSION: ${{ needs.meta.outputs.semver }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Lattie Desktop Dev Build

          Version: ${OVERRIDE_VERSION}
          Built at: $(date -u '+%Y-%m-%d %H:%M:%SZ')

          > ⚠️ This is a development pre-release. Auto-update is disabled for this build.
          EOF

      - name: Create GitHub Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t assets < <(find artifacts -type f | sort)

          if gh release view "${TAG_NAME}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release delete "${TAG_NAME}" --repo ${{ github.repository }} -y || true
          fi

          gh release create "${TAG_NAME}" "${assets[@]}" \
            --repo ${{ github.repository }} \
            --title "Lattie Desktop Dev ${OVERRIDE_VERSION}" \
            --prerelease \
            --notes-file release-notes.md
