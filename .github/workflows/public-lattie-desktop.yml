name: Build Lattie Desktop Release

on:
  repository_dispatch:
    types: [build-release]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to build (e.g. v1.2.3)
        required: true
        type: string
      draft:
        description: Create release as draft
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark release as prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.20.0'
  PNPM_STORE_PATH: ~/.pnpm-store
  APP_DIR: apps/lattie-desktop

jobs:
  # ============================================
  # Meta: 解析 dispatch payload
  # ============================================
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      semver: ${{ steps.meta.outputs.semver }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Parse dispatch payload
        id: meta
        run: |
          set -euo pipefail

          # Support both repository_dispatch and workflow_dispatch
          TAG="${{ github.event.client_payload.tag || inputs.tag }}"
          SHA="${{ github.event.client_payload.sha || github.sha }}"

          if [ -z "$TAG" ]; then
            echo "::error::Tag is required"
            exit 1
          fi

          SHORT_SHA="${SHA:0:7}"
          SEMVER="${TAG#v}"

          DRAFT="${{ inputs.draft || 'false' }}"
          PRERELEASE="${{ inputs.prerelease || 'false' }}"

          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

          echo "Tag: ${TAG}"
          echo "Semver: ${SEMVER}"
          echo "Short SHA: ${SHORT_SHA}"

  # ============================================
  # macOS ARM64 Build (Apple Silicon)
  # ============================================
  macos-arm64:
    needs: meta
    runs-on: macos-latest
    env:
      SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
      OVERRIDE_VERSION: ${{ needs.meta.outputs.semver }}
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
      CSC_FOR_PULL_REQUEST: 'true'
      CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: feiandxs/first-quarter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ env.TAG_NAME }}

      - name: Configure code signing keychain
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK_BASE64:-}" ]; then
            echo 'CSC_LINK_BASE64 secret is required for code signing' >&2
            exit 1
          fi
          if [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo 'CSC_KEY_PASSWORD secret is required for code signing' >&2
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/lattie-developer-id.p12"
          KEYCHAIN_NAME="lattie-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          echo "${CSC_LINK_BASE64}" | base64 --decode > "${CERT_PATH}"
          security delete-keychain "${KEYCHAIN_NAME}" 2>/dev/null || true
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security set-keychain-settings "${KEYCHAIN_NAME}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_NAME}" -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productsign
          existing_keychains=$(security list-keychains -d user | sed 's/\"//g')
          security list-keychains -d user -s "${KEYCHAIN_NAME}" ${existing_keychains}
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          echo "CSC_LINK=${CERT_PATH}" >> "${GITHUB_ENV}"
          echo "KEYCHAIN_NAME=${KEYCHAIN_NAME}" >> "${GITHUB_ENV}"
          echo "KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install setuptools for node-gyp
        shell: bash
        run: pip3 install setuptools --break-system-packages || pip3 install setuptools

      - name: Override package version
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.OVERRIDE_VERSION;
          if (!version) process.exit(0);
          const pkgPath = path.join(process.cwd(), process.env.APP_DIR, 'package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Install dependencies
        shell: bash
        run: |
          pnpm --version
          pnpm install --frozen-lockfile --config.store-dir=${{ env.PNPM_STORE_PATH }}

      - name: Build project
        shell: bash
        run: pnpm --filter lattie-desktop build

      - name: Verify notarization environment
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then
              echo "::error::${var} is empty"
              missing=1
            else
              echo "${var} is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Package artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter lattie-desktop exec electron-builder --mac --arm64 --publish never
          mkdir -p release
          APP_DIST="${APP_DIR}/dist"
          zip=$(find "$APP_DIST" -maxdepth 1 -type f -name '*.zip' ! -name '*.blockmap' -print -quit || true)
          if [ -z "$zip" ]; then
            echo 'No zip artifact produced by electron-builder' >&2
            exit 1
          fi
          cp "$zip" "release/$(basename "$zip")"
          if [ -f "$APP_DIST/latest-mac.yml" ]; then
            cp "$APP_DIST/latest-mac.yml" "release/latest-mac.yml"
          fi
          find "$APP_DIST" -maxdepth 1 -type f -name '*.dmg' -exec cp {} release/ \;
          find "$APP_DIST" -maxdepth 1 -type f -name '*.blockmap' -exec cp {} release/ \;

      - name: Validate notarization
        shell: bash
        run: |
          set -euo pipefail
          APP_DIST="${APP_DIR}/dist"
          ARCHIVE=$(find "$APP_DIST" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.dmg' \) ! -name '*.blockmap' -print -quit || true)
          if [ -z "$ARCHIVE" ]; then
            echo 'No archive artifact found to validate' >&2
            exit 1
          fi
          EXTRACT_DIR="$(mktemp -d)"
          if [[ "$ARCHIVE" == *.zip ]]; then
            ditto -x -k "$ARCHIVE" "$EXTRACT_DIR"
          else
            hdiutil attach "$ARCHIVE" -mountpoint "$EXTRACT_DIR/mnt" -nobrowse
            cp -R "$EXTRACT_DIR/mnt"/*.app "$EXTRACT_DIR/" 2>/dev/null || true
            hdiutil detach "$EXTRACT_DIR/mnt"
          fi
          APP_PATH=$(find "$EXTRACT_DIR" -maxdepth 2 -type d -name '*.app' -print -quit || true)
          if [ -z "$APP_PATH" ]; then
            echo 'Unable to locate .app bundle within archive' >&2
            exit 1
          fi
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec -vv "$APP_PATH"

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_NAME:-}" ]; then
            security delete-keychain "${KEYCHAIN_NAME}" || true
          fi

  # ============================================
  # macOS x64 Build (Intel)
  # ============================================
  macos-x64:
    needs: meta
    runs-on: macos-14
    env:
      SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
      OVERRIDE_VERSION: ${{ needs.meta.outputs.semver }}
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
      CSC_FOR_PULL_REQUEST: 'true'
      CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: feiandxs/first-quarter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ env.TAG_NAME }}

      - name: Configure code signing keychain
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK_BASE64:-}" ]; then
            echo 'CSC_LINK_BASE64 secret is required for code signing' >&2
            exit 1
          fi
          if [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo 'CSC_KEY_PASSWORD secret is required for code signing' >&2
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/lattie-developer-id.p12"
          KEYCHAIN_NAME="lattie-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          echo "${CSC_LINK_BASE64}" | base64 --decode > "${CERT_PATH}"
          security delete-keychain "${KEYCHAIN_NAME}" 2>/dev/null || true
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security set-keychain-settings "${KEYCHAIN_NAME}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_NAME}" -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productsign
          existing_keychains=$(security list-keychains -d user | sed 's/\"//g')
          security list-keychains -d user -s "${KEYCHAIN_NAME}" ${existing_keychains}
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          echo "CSC_LINK=${CERT_PATH}" >> "${GITHUB_ENV}"
          echo "KEYCHAIN_NAME=${KEYCHAIN_NAME}" >> "${GITHUB_ENV}"
          echo "KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install setuptools for node-gyp
        shell: bash
        run: pip3 install setuptools --break-system-packages || pip3 install setuptools

      - name: Override package version
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.OVERRIDE_VERSION;
          if (!version) process.exit(0);
          const pkgPath = path.join(process.cwd(), process.env.APP_DIR, 'package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Install dependencies
        shell: bash
        run: |
          pnpm --version
          pnpm install --frozen-lockfile --config.store-dir=${{ env.PNPM_STORE_PATH }}

      - name: Build project
        shell: bash
        run: pnpm --filter lattie-desktop build

      - name: Verify notarization environment
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then
              echo "::error::${var} is empty"
              missing=1
            else
              echo "${var} is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Package artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter lattie-desktop exec electron-builder --mac --x64 --publish never
          mkdir -p release
          APP_DIST="${APP_DIR}/dist"
          zip=$(find "$APP_DIST" -maxdepth 1 -type f -name '*.zip' ! -name '*.blockmap' -print -quit || true)
          if [ -z "$zip" ]; then
            echo 'No zip artifact produced by electron-builder' >&2
            exit 1
          fi
          cp "$zip" "release/$(basename "$zip")"
          if [ -f "$APP_DIST/latest-mac.yml" ]; then
            cp "$APP_DIST/latest-mac.yml" "release/latest-mac.yml"
          fi
          find "$APP_DIST" -maxdepth 1 -type f -name '*.dmg' -exec cp {} release/ \;
          find "$APP_DIST" -maxdepth 1 -type f -name '*.blockmap' -exec cp {} release/ \;

      - name: Validate notarization
        shell: bash
        run: |
          set -euo pipefail
          APP_DIST="${APP_DIR}/dist"
          ARCHIVE=$(find "$APP_DIST" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.dmg' \) ! -name '*.blockmap' -print -quit || true)
          if [ -z "$ARCHIVE" ]; then
            echo 'No archive artifact found to validate' >&2
            exit 1
          fi
          EXTRACT_DIR="$(mktemp -d)"
          if [[ "$ARCHIVE" == *.zip ]]; then
            ditto -x -k "$ARCHIVE" "$EXTRACT_DIR"
          else
            hdiutil attach "$ARCHIVE" -mountpoint "$EXTRACT_DIR/mnt" -nobrowse
            cp -R "$EXTRACT_DIR/mnt"/*.app "$EXTRACT_DIR/" 2>/dev/null || true
            hdiutil detach "$EXTRACT_DIR/mnt"
          fi
          APP_PATH=$(find "$EXTRACT_DIR" -maxdepth 2 -type d -name '*.app' -print -quit || true)
          if [ -z "$APP_PATH" ]; then
            echo 'Unable to locate .app bundle within archive' >&2
            exit 1
          fi
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec -vv "$APP_PATH"

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: release

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_NAME:-}" ]; then
            security delete-keychain "${KEYCHAIN_NAME}" || true
          fi

  # ============================================
  # Windows x64 Build
  # ============================================
  windows-x64:
    needs: meta
    runs-on: windows-latest
    env:
      SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
      OVERRIDE_VERSION: ${{ needs.meta.outputs.semver }}
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: feiandxs/first-quarter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ env.TAG_NAME }}

      - name: Map workspace to short drive
        shell: pwsh
        run: |
          $drive = "W:"
          try { subst $drive /d | Out-Null } catch {}
          subst $drive $env:GITHUB_WORKSPACE
          "WW_WORKSPACE=$drive\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure pnpm for shorter paths
        shell: bash
        run: pnpm config set virtual-store-dir-max-length 70

      - name: Override package version
        shell: bash
        working-directory: ${{ env.WW_WORKSPACE }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.OVERRIDE_VERSION;
          if (!version) process.exit(0);
          const pkgPath = path.join(process.cwd(), process.env.APP_DIR, 'package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Install dependencies
        shell: bash
        working-directory: ${{ env.WW_WORKSPACE }}
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build project
        shell: bash
        working-directory: ${{ env.WW_WORKSPACE }}
        run: pnpm --filter lattie-desktop build

      - name: Package artifacts
        shell: bash
        working-directory: ${{ env.WW_WORKSPACE }}
        run: |
          set -euo pipefail
          pnpm --filter lattie-desktop exec electron-builder --win nsis --x64 --publish never
          mkdir -p release
          APP_DIST="${APP_DIR}/dist"
          installer=$(find "$APP_DIST" -maxdepth 1 -type f -name '*.exe' -print -quit || true)
          if [ -z "$installer" ]; then
            echo 'No Windows installer produced by electron-builder' >&2
            exit 1
          fi
          cp "$installer" "release/$(basename "$installer")"
          if [ -f "$APP_DIST/latest.yml" ]; then
            cp "$APP_DIST/latest.yml" "release/latest.yml"
          fi
          find "$APP_DIST" -maxdepth 1 -type f -name '*.blockmap' -exec cp {} release/ \;

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release

  # ============================================
  # Linux x64 Build
  # ============================================
  linux-x64:
    needs: meta
    runs-on: ubuntu-latest
    env:
      SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
      OVERRIDE_VERSION: ${{ needs.meta.outputs.semver }}
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: feiandxs/first-quarter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ env.TAG_NAME }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Override package version
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.OVERRIDE_VERSION;
          if (!version) process.exit(0);
          const pkgPath = path.join(process.cwd(), process.env.APP_DIR, 'package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Install dependencies
        shell: bash
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build project
        shell: bash
        run: pnpm --filter lattie-desktop build

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter lattie-desktop exec electron-builder --linux --x64 --publish never
          mkdir -p release
          APP_DIST="${APP_DIR}/dist"
          appimage=$(find "$APP_DIST" -maxdepth 1 -type f -name '*.AppImage' -print -quit || true)
          if [ -z "$appimage" ]; then
            echo 'No AppImage produced by electron-builder' >&2
            exit 1
          fi
          cp "$appimage" "release/$(basename "$appimage")"
          if [ -f "$APP_DIST/latest-linux.yml" ]; then
            cp "$APP_DIST/latest-linux.yml" "release/latest-linux.yml"
          fi

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release

  # ============================================
  # Create Release: 创建 GitHub Release
  # ============================================
  create-release:
    needs:
      - meta
      - macos-arm64
      - macos-x64
      - windows-x64
      - linux-x64
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
      RELEASE_DRAFT: ${{ needs.meta.outputs.draft }}
      RELEASE_PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge macOS yml files
        shell: bash
        run: |
          set -euo pipefail
          ARM64_YML="artifacts/macos-arm64/latest-mac.yml"
          X64_YML="artifacts/macos-x64/latest-mac.yml"
          MERGED_YML="artifacts/latest-mac.yml"

          if [ -f "$ARM64_YML" ] && [ -f "$X64_YML" ]; then
            echo "Merging latest-mac.yml files..."

            VERSION=$(grep "^version:" "$ARM64_YML" | head -1)
            RELEASE_DATE=$(grep "^releaseDate:" "$ARM64_YML" | head -1)

            ARM64_FILES=$(awk '/^files:/{flag=1; next} /^[a-zA-Z]/ && flag{flag=0} flag' "$ARM64_YML")
            X64_FILES=$(awk '/^files:/{flag=1; next} /^[a-zA-Z]/ && flag{flag=0} flag' "$X64_YML")

            PATH_LINE=$(grep "^path:" "$ARM64_YML" | head -1)
            SHA512_LINE=$(grep "^sha512:" "$ARM64_YML" | head -1)

            echo "$VERSION" > "$MERGED_YML"
            echo "files:" >> "$MERGED_YML"
            echo "$ARM64_FILES" >> "$MERGED_YML"
            echo "$X64_FILES" >> "$MERGED_YML"
            echo "$PATH_LINE" >> "$MERGED_YML"
            echo "$SHA512_LINE" >> "$MERGED_YML"
            echo "$RELEASE_DATE" >> "$MERGED_YML"

            echo "Merged latest-mac.yml:"
            cat "$MERGED_YML"

            rm -f "$ARM64_YML" "$X64_YML"
          elif [ -f "$ARM64_YML" ]; then
            echo "Only arm64 yml found, moving to artifacts root"
            mv "$ARM64_YML" "$MERGED_YML"
          elif [ -f "$X64_YML" ]; then
            echo "Only x64 yml found, moving to artifacts root"
            mv "$X64_YML" "$MERGED_YML"
          fi

          WIN_YML="artifacts/windows-x64/latest.yml"
          if [ -f "$WIN_YML" ]; then
            mv "$WIN_YML" "artifacts/latest.yml"
          fi

          LINUX_YML="artifacts/linux-x64/latest-linux.yml"
          if [ -f "$LINUX_YML" ]; then
            mv "$LINUX_YML" "artifacts/latest-linux.yml"
          fi

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          assets_file="release-assets.txt"

          find artifacts -maxdepth 1 -type f -name '*.yml' -print > "$assets_file"

          find artifacts -mindepth 2 -type f \( \
            -name '*.zip' -o \
            -name '*.dmg' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.blockmap' \
          \) -print >> "$assets_file"

          sort -o "$assets_file" "$assets_file"

          if [ ! -s "$assets_file" ]; then
            echo 'No eligible release assets were found' >&2
            exit 1
          fi

          cat "$assets_file"
          echo "assets_file=$assets_file" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TIME="$(date -u '+%Y-%m-%d %H:%M:%SZ')"
          cat > release-notes.md << EOF
          ## Lattie Desktop ${TAG_NAME}

          Released at: ${RELEASE_TIME}

          ### Downloads

          | Platform | Architecture | Available |
          |----------|--------------|-----------|
          | macOS | Apple Silicon (arm64) | Yes |
          | macOS | Intel (x64) | Yes |
          | Windows | x64 | Yes |
          | Linux | x64 | Yes |
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS_FILE: ${{ steps.assets.outputs.assets_file }}
        shell: bash
        run: |
          set -euo pipefail

          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < "${ASSETS_FILE}"

          if gh release view "${TAG_NAME}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release delete "${TAG_NAME}" --repo ${{ github.repository }} -y || true
          fi

          flags=()
          if [ "${RELEASE_DRAFT}" = "true" ]; then
            flags+=(--draft)
          fi
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            flags+=(--prerelease)
          fi

          gh release create "${TAG_NAME}" "${assets[@]}" \
            --repo ${{ github.repository }} \
            --title "Lattie Desktop ${TAG_NAME}" \
            --notes-file release-notes.md \
            "${flags[@]}"

  # ============================================
  # Cleanup: 清理 artifacts
  # ============================================
  cleanup:
    needs:
      - create-release
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Clean up artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Cleaning up artifacts from this run..."
          for id in $(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[].id'); do
            echo "Deleting artifact $id..."
            gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id || true
          done
          echo "Artifacts cleaned up"
