name: Build Lattie Desktop Release

on:
  repository_dispatch:
    types: [build-release]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to build (e.g. lattie-desktop/v1.2.3)
        required: true
        type: string
      draft:
        description: Create release as draft
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark release as prerelease
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.20.0'
  PNPM_STORE_PATH: ~/.pnpm-store
  APP_DIR: apps/lattie-desktop

jobs:
  # ============================================
  # Meta: 解析 dispatch payload
  # ============================================
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      semver: ${{ steps.meta.outputs.semver }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Parse dispatch payload
        id: meta
        run: |
          set -euo pipefail

          TAG="${{ github.event.client_payload.tag || inputs.tag }}"
          SHA="${{ github.event.client_payload.sha || github.sha }}"

          if [ -z "$TAG" ]; then
            echo "::error::Tag is required"
            exit 1
          fi

          SHORT_SHA="${SHA:0:7}"
          TAG_VERSION="${TAG##*/}"
          SEMVER="${TAG_VERSION#v}"

          DRAFT="${{ inputs.draft || 'false' }}"
          PRERELEASE="${{ inputs.prerelease || 'false' }}"

          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

          echo "Tag: ${TAG}"
          echo "Semver: ${SEMVER}"
          echo "Short SHA: ${SHORT_SHA}"

  # ============================================
  # macOS Universal Build (arm64 + x64 fat binary)
  # ============================================
  macos-universal:
    needs: meta
    runs-on: macos-latest
    env:
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
      OVERRIDE_VERSION: ${{ needs.meta.outputs.semver }}
      # 代码签名 & 公证 —— 旧 Secret 名不变，在这里映射成 Tauri 期望的变量名
      CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.CSC_LINK_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: feiandxs/first-quarter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ env.TAG_NAME }}

      - name: Configure code signing keychain
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK_BASE64:-}" ]; then
            echo 'CSC_LINK_BASE64 secret is required for code signing' >&2
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/lattie-developer-id.p12"
          KEYCHAIN_NAME="lattie-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          echo "${CSC_LINK_BASE64}" | base64 --decode > "${CERT_PATH}"
          security delete-keychain "${KEYCHAIN_NAME}" 2>/dev/null || true
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security set-keychain-settings "${KEYCHAIN_NAME}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_NAME}" -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productsign
          existing_keychains=$(security list-keychains -d user | sed 's/\"//g')
          security list-keychains -d user -s "${KEYCHAIN_NAME}" ${existing_keychains}
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          echo "KEYCHAIN_NAME=${KEYCHAIN_NAME}" >> "${GITHUB_ENV}"
          echo "KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust toolchain (universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Override version (package.json / tauri.conf.json / Cargo.toml)
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const appDir = process.env.APP_DIR
          const version = process.env.OVERRIDE_VERSION
          if (!appDir || !version) process.exit(1)

          const pkgPath = path.join(process.cwd(), appDir, 'package.json')
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          pkg.version = version
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')

          const confPath = path.join(process.cwd(), appDir, 'src-tauri', 'tauri.conf.json')
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'))
          conf.version = version
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n')

          const cargoPath = path.join(process.cwd(), appDir, 'src-tauri', 'Cargo.toml')
          const cargo = fs.readFileSync(cargoPath, 'utf8')
          const next = cargo.replace(/^version = ".*"$/m, `version = "${version}"`)
          fs.writeFileSync(cargoPath, next)
          NODE

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --config.store-dir=${{ env.PNPM_STORE_PATH }}

      - name: Build Tauri (macOS Universal)
        shell: bash
        run: |
          pnpm --filter lattie-desktop tauri build \
            --target universal-apple-darwin \
            --bundles app,dmg \
            --ci

      - name: Notarize and staple DMG
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="target/universal-apple-darwin/release/bundle/dmg"
          DMG_PATH=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.dmg' -print -quit || true)
          [ -z "$DMG_PATH" ] && { echo "::error::No .dmg found" >&2; exit 1; }
          echo "Notarizing DMG: $DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Validate notarization
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="target/universal-apple-darwin/release/bundle/macos"
          APP_PATH=$(find "$BUNDLE_DIR" -maxdepth 1 -type d -name '*.app' -print -quit || true)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Unable to locate .app bundle" >&2; exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec -vv "$APP_PATH"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          BUNDLE_DIR="target/universal-apple-darwin/release/bundle"
          find "$BUNDLE_DIR/macos" "$BUNDLE_DIR/dmg" -maxdepth 1 -type f \( \
            -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
          \) -exec cp {} release/ \; 2>/dev/null || true
          ls -la release

      - name: Upload macOS universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: release

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_NAME:-}" ]; then
            security delete-keychain "${KEYCHAIN_NAME}" || true
          fi

  # ============================================
  # Windows x64 Build
  # ============================================
  windows-x64:
    needs: meta
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
      OVERRIDE_VERSION: ${{ needs.meta.outputs.semver }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: feiandxs/first-quarter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ env.TAG_NAME }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure pnpm for shorter paths
        shell: bash
        run: pnpm config set virtual-store-dir-max-length 70

      - name: Override version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs'), path = require('path')
          const appDir = process.env.APP_DIR, version = process.env.OVERRIDE_VERSION
          if (!appDir || !version) process.exit(1)
          const pkgPath = path.join(process.cwd(), appDir, 'package.json')
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          pkg.version = version
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')
          const confPath = path.join(process.cwd(), appDir, 'src-tauri', 'tauri.conf.json')
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'))
          conf.version = version
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n')
          const cargoPath = path.join(process.cwd(), appDir, 'src-tauri', 'Cargo.toml')
          const cargo = fs.readFileSync(cargoPath, 'utf8')
          fs.writeFileSync(cargoPath, cargo.replace(/^version = ".*"$/m, `version = "${version}"`))
          NODE

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (Windows x64)
        shell: bash
        run: |
          pnpm --filter lattie-desktop tauri build \
            --bundles nsis,msi \
            --ci

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          NSIS_DIR="target/release/bundle/nsis"
          MSI_DIR="target/release/bundle/msi"
          for dir in "$NSIS_DIR" "$MSI_DIR"; do
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 1 -type f \( \
                -name '*.exe' -o -name '*.msi' -o -name '*.nsis.zip' -o -name '*.msi.zip' -o -name '*.sig' \
              \) -exec cp {} release/ \;
            fi
          done
          # 文件名空格替换为点（避免 gh release 上传问题）
          find release -maxdepth 1 -type f | while read -r f; do
            new="${f// /.}"
            [ "$new" != "$f" ] && mv "$f" "$new" || true
          done
          ls -la release

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release

  # ============================================
  # Linux x64 Build
  # ============================================
  linux-x64:
    needs: meta
    runs-on: ubuntu-22.04
    env:
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
      OVERRIDE_VERSION: ${{ needs.meta.outputs.semver }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: feiandxs/first-quarter
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ env.TAG_NAME }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Override version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs'), path = require('path')
          const appDir = process.env.APP_DIR, version = process.env.OVERRIDE_VERSION
          if (!appDir || !version) process.exit(1)
          const pkgPath = path.join(process.cwd(), appDir, 'package.json')
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))
          pkg.version = version
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')
          const confPath = path.join(process.cwd(), appDir, 'src-tauri', 'tauri.conf.json')
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'))
          conf.version = version
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + '\n')
          const cargoPath = path.join(process.cwd(), appDir, 'src-tauri', 'Cargo.toml')
          const cargo = fs.readFileSync(cargoPath, 'utf8')
          fs.writeFileSync(cargoPath, cargo.replace(/^version = ".*"$/m, `version = "${version}"`))
          NODE

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --config.store-dir=${{ env.PNPM_STORE_PATH }}

      - name: Build Tauri (Linux x64)
        shell: bash
        run: |
          pnpm --filter lattie-desktop tauri build \
            --bundles appimage,deb \
            --ci

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          BUNDLE_DIR="target/release/bundle"
          find "$BUNDLE_DIR/appimage" "$BUNDLE_DIR/deb" -maxdepth 1 -type f \( \
            -name '*.AppImage' -o -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' \
            -o -name '*.deb' \
          \) -exec cp {} release/ \; 2>/dev/null || true
          ls -la release

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: release

  # ============================================
  # Create Release
  # ============================================
  create-release:
    needs:
      - meta
      - macos-universal
      - windows-x64
      - linux-x64
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.meta.outputs.tag_name }}
      OVERRIDE_VERSION: ${{ needs.meta.outputs.semver }}
      RELEASE_DRAFT: ${{ needs.meta.outputs.draft }}
      RELEASE_PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate latest.json (updater manifest)
        shell: bash
        run: |
          set -euo pipefail

          PUBLISHED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          RELEASE_REPO="feiandxs/lattie-releases"

          find_sig() { cat "$1.sig" 2>/dev/null | tr -d '\r\n'; }
          file_url() { echo "https://github.com/${RELEASE_REPO}/releases/download/${TAG_NAME}/$(basename $1)"; }

          # macOS: 单个 Universal Binary 同时服务 arm64 和 x86_64
          MAC=$(find artifacts/macos-universal -name '*.app.tar.gz' | head -1)
          WIN=$(find artifacts/windows-x64 -name '*.nsis.zip' -o -name '*.msi.zip' | head -1)
          LIN=$(find artifacts/linux-x64   -name '*.AppImage.tar.gz' | head -1)

          for f in "$MAC" "$WIN" "$LIN"; do
            [ -z "$f" ] && { echo "::error::Missing updater artifact" >&2; exit 1; }
          done

          cat > artifacts/latest.json <<EOF
          {
            "version": "${OVERRIDE_VERSION}",
            "notes": "Lattie Desktop ${TAG_NAME}",
            "pub_date": "${PUBLISHED_AT}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$(find_sig $MAC)",
                "url": "$(file_url $MAC)"
              },
              "darwin-x86_64": {
                "signature": "$(find_sig $MAC)",
                "url": "$(file_url $MAC)"
              },
              "windows-x86_64": {
                "signature": "$(find_sig $WIN)",
                "url": "$(file_url $WIN)"
              },
              "linux-x86_64": {
                "signature": "$(find_sig $LIN)",
                "url": "$(file_url $LIN)"
              }
            }
          }
          EOF

          cat artifacts/latest.json

      - name: Generate release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## Lattie Desktop ${TAG_NAME}

          Released at: $(date -u '+%Y-%m-%d %H:%M:%SZ')

          ### Downloads

          | Platform | Architecture | Format |
          |----------|--------------|--------|
          | macOS | Universal (arm64 + Intel) | .dmg |
          | Windows | x64 | .exe (NSIS) / .msi |
          | Linux | x64 | .AppImage / .deb |
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t assets < <(find artifacts -type f | sort)

          if gh release view "${TAG_NAME}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release delete "${TAG_NAME}" --repo ${{ github.repository }} -y || true
          fi

          flags=()
          [ "${RELEASE_DRAFT}" = "true" ] && flags+=(--draft)
          [ "${RELEASE_PRERELEASE}" = "true" ] && flags+=(--prerelease)

          gh release create "${TAG_NAME}" "${assets[@]}" \
            --repo ${{ github.repository }} \
            --title "Lattie Desktop ${TAG_NAME}" \
            --notes-file release-notes.md \
            "${flags[@]}"
